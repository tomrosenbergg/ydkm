<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You Don't Know Me</title>
  <style>
    body {
      box-sizing: border-box;
      min-height: 100svh;
      margin: 0;
      padding: clamp(1.5rem, 5vw, 4rem);
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      background: #f7f6f2;
      color: #20201e;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    main {
      grid-row: 2;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3.5vw, 2.625rem);
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    footer {
      grid-row: 3;
      align-self: end;
      justify-self: end;
      padding-top: 2rem;
    }

    a {
      color: inherit;
      text-underline-offset: 0.2em;
    }
  </style>
</head>
<body>
  <main>
    <h1>You Don't Know Me</h1>
  </main>
  <footer>
    <a href="mailto:tom@ydkm.net">Contact</a>
  </footer>
</body>
</html>
