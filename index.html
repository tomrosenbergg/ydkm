<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You Don't Know Me</title>
  <style>
    body {
      box-sizing: border-box;
      min-height: 100svh;
      margin: 0;
      padding: clamp(1.5rem, 5vw, 4rem);
      display: grid;
      background: #adadad;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    @media (prefers-reduced-motion: no-preference) {
      body {
        animation: grey-shift 10s ease-in-out infinite;
      }
    }

    @keyframes grey-shift {
      0%, 100% {
        background-color: #a6a6a6;
      }

      40% {
        background-color: #e8e8e8;
      }
    }

    main {
      align-self: end;
      justify-self: end;
      font-size: 0.875rem;
    }

    a {
      color: #0000ee;
      text-underline-offset: 0.2em;
    }
  </style>
</head>
<body>
  <main>
    <a href="mailto:tom@ydkm.net">You don't know me</a>
  </main>
</body>
</html>
